services:
  - type: web
    name: basoyf-talent-assessment
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: basoyf-assessment-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PIN
        sync: false
databases:
  - name: basoyf-assessment-db
    plan: free
